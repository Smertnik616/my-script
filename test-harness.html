<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FalconRoute — тестовий стенд</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b1220; color: #e5e7eb; font: 13px/1.4 system-ui, sans-serif; }
    #map { position: absolute; inset: 0; }
    #hud {
      position: fixed; z-index: 10; left: 12px; bottom: 12px; max-width: min(440px, calc(100vw - 24px));
      background: rgba(15, 23, 42, 0.94); border: 1px solid #334155; border-radius: 10px;
      padding: 10px 12px; box-shadow: 0 8px 24px rgba(0,0,0,.45);
    }
    #hud h1 { margin: 0 0 6px; font-size: 14px; font-weight: 700; color: #93c5fd; }
    #hud p { margin: 0 0 6px; color: #cbd5e1; }
    #hud code { background: #1e293b; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
    #hud a { color: #7dd3fc; }
    #status { margin-top: 8px; color: #86efac; white-space: pre-wrap; }
    #status.err { color: #fca5a5; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="hud">
    <h1>🦅 FalconRoute test harness</h1>
    <p>Тільки через HTTP: <code>http://127.0.0.1:8765/…</code></p>
    <p>
      <a href="?client=wind&amp;engine=cesium">wind + cesium</a> ·
      <a href="?client=alpha&amp;engine=cesium">alpha</a>
    </p>
    <p>Двигун: <code id="engine-label">…</code></p>
    <div id="status">Завантаження…</div>
  </div>

  <script>
    (function setupClientId() {
      const params = new URLSearchParams(location.search);
      const client = (params.get('client') || 'wind').trim();
      localStorage.setItem('falcon_route_client_id_v1', 'test_' + client.replace(/[^\w-]/g, '').slice(0, 24));
      localStorage.setItem('falcon_route_local_test_v1', '1');
    })();

    const params = new URLSearchParams(location.search);
    const engine = (params.get('engine') || 'cesium').toLowerCase();
    const scriptSrc = './falcon-route.js?v=' + Date.now();
    const statusEl = document.getElementById('status');
    const engineLabel = document.getElementById('engine-label');

    function setStatus(msg, isErr) {
      statusEl.textContent = msg;
      statusEl.className = isErr ? 'err' : '';
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.async = true;
        s.onload = () => resolve();
        s.onerror = () => reject(new Error('Не вдалося завантажити ' + src));
        document.head.appendChild(s);
      });
    }

    async function bootCesium() {
      engineLabel.textContent = 'cesium (OSM)';
      await loadScript('https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Cesium.js');
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Widgets/widgets.css';
      document.head.appendChild(link);

      try { Cesium.Ion.defaultAccessToken = ''; } catch (_) {}

      const osm = new Cesium.UrlTemplateImageryProvider({
        url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
        credit: '© OpenStreetMap'
      });

      const viewerOpts = {
        animation: false,
        timeline: false,
        baseLayerPicker: false,
        geocoder: false,
        homeButton: false,
        sceneModePicker: false,
        navigationHelpButton: false,
        fullscreenButton: false,
        infoBox: false,
        selectionIndicator: false
      };
      // Cesium 1.107+: baseLayer; старші ігнорують невідоме поле
      try { viewerOpts.baseLayer = new Cesium.ImageryLayer(osm); } catch (_) {}

      const viewer = new Cesium.Viewer('map', viewerOpts);
      try {
        if (!viewerOpts.baseLayer) {
          viewer.imageryLayers.removeAll();
          viewer.imageryLayers.addImageryProvider(osm);
        }
      } catch (err) {
        console.warn('imagery fallback', err);
        try {
          viewer.imageryLayers.removeAll();
          viewer.imageryLayers.addImageryProvider(osm);
        } catch (_) {}
      }

      viewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(30.5234, 50.4501, 250000)
      });

      // Щоб FR-кліки працювали на Cesium
      try { viewer.canvas = viewer.scene.canvas; } catch (_) {}

      window.viewer = viewer;
      window.cesiumViewer = viewer;
      return viewer;
    }

    async function main() {
      try {
        if (location.protocol === 'file:') {
          throw new Error('Не file:// — відкрий http://127.0.0.1:8765/test-harness.html?client=wind&engine=cesium');
        }
        await bootCesium();
        setStatus('Карта OK. Гружу FalconRoute…');
        await loadScript(scriptSrc);
        setTimeout(() => {
          const ui = document.getElementById('falcon-route-ui');
          const meta = ui && ui.querySelector('.fr-head-meta');
          setStatus(
            (ui ? 'Панель OK' : 'Панель НЕ зʼявилась — дивись Console') +
            (meta ? ' · ' + meta.textContent : '') +
            '\nЩе → Вітер'
          );
          if (!ui) statusEl.className = 'err';
        }, 800);
      } catch (err) {
        console.error(err);
        setStatus(String(err && err.message || err), true);
      }
    }

    main();
  </script>
</body>
</html>
